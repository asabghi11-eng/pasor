<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>حکم — فاز ۴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Real Google Sign-In (Google Identity Services). Loaded async; if it's
     blocked/offline the page still works, loginGoogle() just falls back
     to guest — see the GOOGLE_CLIENT_ID note near SERVER_URL below. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --felt-1:#8a2c22;
    --felt-2:#5c1a15;
    --felt-edge:#3a100d;
    --gold:#cda449;
    --gold-bright:#f2d488;
    --cream:#f6efdc;
    --ink:#221a10;
    --teamA:#e0b559;
    --teamB:#8fb9c9;
    --maroon:#9a332c;
    --navy:#22405f;
    --panel:#1c110d;
    --panel-2:#241712;
    --table-border:#7a5a26;
    --table-outline:var(--gold);
    --back-grad-1:#2c5a44;
    --back-grad-2:#0f2f24;
    --back-border:var(--gold);
  }
  *{box-sizing:border-box;}

  /* ---- card skins ---- (--skin-glow drives hover glow + matches this
     skin's particle/VFX accent color, set in SKINS[].accent in JS) */
  #app[data-skin="classic"]{--skin-glow:rgba(242,212,136,.4);}
  #app[data-skin="royal"]{--card-bg:#f3e8d8;--card-border:#cda449;--card-ink:#22204a;--card-red:#7a1220;--back-grad-1:#4a1942;--back-grad-2:#22091f;--back-border:#e8c876;--skin-glow:rgba(232,200,118,.5);}
  #app[data-skin="neon"]{--card-bg:#12121c;--card-border:#37e6d6;--card-ink:#37e6d6;--card-red:#ff3d8a;--back-grad-1:#0d0d16;--back-grad-2:#000;--back-border:#ff3d8a;--skin-glow:rgba(55,230,214,.6);}
  #app[data-skin="neon"] .pcard{box-shadow:0 0 10px rgba(55,230,214,.55),0 3px 6px rgba(0,0,0,.5);}
  #app[data-skin="neon"] .card-back{box-shadow:0 0 10px rgba(255,61,138,.55);}
  #app[data-skin="wood"]{--card-bg:#e8d3a5;--card-border:#6b4423;--card-ink:#4a2f18;--card-red:#8a3b24;--back-grad-1:#6b4423;--back-grad-2:#33200f;--back-border:#c99a55;--skin-glow:rgba(201,154,85,.45);}
  #app[data-skin="gold"]{--card-bg:#fff3d0;--card-border:#a5822a;--card-ink:#1c1a12;--card-red:#8a1b1b;--back-grad-1:#d4af37;--back-grad-2:#7a5c14;--back-border:#fff3d0;--skin-glow:rgba(242,212,136,.6);}
  #app[data-skin="gold"] .pcard{box-shadow:0 0 8px rgba(242,212,136,.5),0 3px 6px rgba(0,0,0,.4);}
  #app[data-skin="black"]{--card-bg:#181818;--card-border:#4a4a4a;--card-ink:#f1e9d8;--card-red:#e0524a;--back-grad-1:#2a2a2a;--back-grad-2:#080808;--back-border:#9a9a9a;--skin-glow:rgba(200,200,200,.4);}
  #app[data-skin="iranian"]{--card-bg:#f3ecd6;--card-border:#1f6f78;--card-ink:#6b1420;--card-red:#1f6f78;--back-grad-1:#1f6f78;--back-grad-2:#5c1a15;--back-border:#cda449;--skin-glow:rgba(31,111,120,.5);}

  /* ---- mythic skin: "حکمِ افسانه‌ای" — Simurgh ink, old gold, deep jade ---- */
  #app[data-skin="mythic"]{
    --card-bg:#f6ecd2;--card-border:#8a6a2a;--card-ink:#241608;--card-red:#7a1f1f;
    --back-grad-1:#0e2b22;--back-grad-2:#040f0b;--back-border:#e3bf6b;
    --skin-glow:rgba(227,191,107,.55);--skin-particle:#e9c977;
  }
  #app[data-skin="mythic"] .pcard{box-shadow:0 0 12px rgba(227,191,107,.4),0 3px 8px rgba(0,0,0,.55) inset,0 3px 6px rgba(0,0,0,.4);border-color:#a5822a;}
  #app[data-skin="mythic"] .trump-suit{box-shadow:0 0 0 1px var(--gold-bright),0 0 16px 3px rgba(227,191,107,.75),0 3px 6px rgba(0,0,0,.4);animation:trumpHalo 2.4s ease-in-out infinite;}
  @keyframes trumpHalo{0%,100%{box-shadow:0 0 0 1px var(--gold-bright),0 0 12px 2px rgba(227,191,107,.6),0 3px 6px rgba(0,0,0,.4);}50%{box-shadow:0 0 0 1px var(--gold-bright),0 0 22px 6px rgba(227,191,107,.9),0 3px 6px rgba(0,0,0,.4);}}
  /* mythic suit glyphs: shamshir / gol-e-anar / negin / sarv, replacing ♠♥♦♣ visually only for this skin */
  #app[data-skin="mythic"] .pcard .s{font-size:0;}
  #app[data-skin="mythic"] .pcard .s::after{font-size:17px;display:inline-block;}
  #app[data-skin="mythic"] .pcard .s[data-suit="S"]::after{content:'⚔';color:#241608;}
  #app[data-skin="mythic"] .pcard.red .s[data-suit="H"]::after{content:'❀';color:#7a1f1f;}
  #app[data-skin="mythic"] .pcard.red .s[data-suit="D"]::after{content:'✦';color:#7a1f1f;}
  #app[data-skin="mythic"] .pcard .s[data-suit="C"]::after{content:'❧';color:#241608;}
  /* ornate ink-and-gold card back with a medallion motif */
  #app[data-skin="mythic"] .card-back{
    background:
      radial-gradient(circle at 50% 50%, rgba(227,191,107,.28), transparent 58%),
      repeating-linear-gradient(45deg, rgba(227,191,107,.07) 0 2px, transparent 2px 9px),
      linear-gradient(160deg,var(--back-grad-1),var(--back-grad-2));
  }
  #app[data-skin="mythic"] .card-back::after{
    inset:5px;border:1px solid rgba(227,191,107,.7);border-radius:4px;
    box-shadow:inset 0 0 0 1px rgba(227,191,107,.25),inset 0 0 10px rgba(227,191,107,.35);
  }
  #app[data-skin="mythic"] .card-back::before{
    content:'✦';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:rgba(227,191,107,.85);text-shadow:0 0 6px rgba(227,191,107,.6);
  }

  /* ---- inkveil skin: "پشتِ کارتِ جوهر سیاه" — silver ink on jet black, splash-back product ---- */
  #app[data-skin="inkveil"]{
    --card-bg:#161616;--card-border:#4a4a4a;--card-ink:#e9e4d6;--card-red:#c94b4b;
    --back-grad-1:#050505;--back-grad-2:#000;--back-border:#3a3a3a;
    --skin-glow:rgba(230,230,230,.35);--skin-particle:#1a1a1a;
  }
  #app[data-skin="inkveil"] .pcard{box-shadow:0 0 10px rgba(200,200,200,.25),0 3px 6px rgba(0,0,0,.6);}
  #app[data-skin="inkveil"] .card-back{
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.1), transparent 40%),
      radial-gradient(circle at 68% 72%, rgba(255,255,255,.06), transparent 35%),
      linear-gradient(160deg,var(--back-grad-1),var(--back-grad-2));
  }
  #app[data-skin="inkveil"] .card-back::after{border-color:rgba(230,230,230,.35);box-shadow:inset 0 0 10px rgba(255,255,255,.08);}
  #app[data-skin="inkveil"] .card-back::before{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background-image:radial-gradient(circle, rgba(230,230,230,.55) 1px, transparent 1.3px),radial-gradient(circle, rgba(230,230,230,.4) 1px, transparent 1.3px);
    background-size:9px 9px, 13px 13px;background-position:2px 3px, 6px 9px;opacity:.5;
  }

  /* ---- table felts ---- */
  #app[data-table="cafe"]{--felt-1:#6b4023;--felt-2:#3a2414;--felt-edge:#20140c;--table-border:#8a6a3a;}
  #app[data-table="wood"]{--felt-1:#1f4a35;--felt-2:#0d2419;--felt-edge:#081712;--table-border:#a67c3d;}
  #app[data-table="stone"]{--felt-1:#54545a;--felt-2:#2c2c30;--felt-edge:#17171a;--table-border:#8a8a90;}
  #app[data-table="marble"]{--felt-1:#d8d3c8;--felt-2:#a8a196;--felt-edge:#6e675c;--table-border:#b8ab8a;}
  #app[data-table="luxury"]{--felt-1:#1c1410;--felt-2:#0a0705;--felt-edge:#000;--table-border:#f2d488;--table-outline:#f2d488;}
  #app[data-table="ember"]{--felt-1:#3a0f05;--felt-2:#170502;--felt-edge:#0a0100;--table-border:#c9481a;--table-outline:#ff9a3d;}
  #app[data-table="ember"] .felt{animation:emberPulse 3.4s ease-in-out infinite;}
  @keyframes emberPulse{
    0%,100%{box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 100px rgba(0,0,0,.55), 0 0 26px rgba(255,122,26,.35);}
    50%{box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 100px rgba(0,0,0,.55), 0 0 46px rgba(255,122,26,.65);}
  }
  #app[data-table="ember"] .felt::before{
    background-image:radial-gradient(circle at 30% 70%, rgba(255,154,61,.18), transparent 45%),radial-gradient(circle at 70% 30%, rgba(255,90,10,.15), transparent 45%);
    opacity:1;
  }
  #app[data-table="luxury"] .felt{box-shadow:0 20px 60px rgba(0,0,0,.65), inset 0 0 120px rgba(0,0,0,.6), 0 0 40px rgba(242,212,136,.25);}
  /* table textures — each felt genuinely changes material, not just color */
  #app[data-table="wood"] .felt::before, #app[data-table="cafe"] .felt::before{
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 3px, transparent 3px 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px);
    background-size:auto;
  }
  #app[data-table="stone"] .felt::before{
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 0 2px, transparent 3px),
      radial-gradient(circle at 60% 70%, rgba(0,0,0,.18) 0 3px, transparent 4px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.06) 0 2px, transparent 3px),
      radial-gradient(circle at 40% 85%, rgba(0,0,0,.14) 0 2px, transparent 3px);
    background-size:70px 70px,90px 90px,60px 60px,80px 80px;
  }
  #app[data-table="marble"] .felt::before{
    background-image:
      linear-gradient(115deg, transparent 40%, rgba(120,110,95,.25) 41%, transparent 43%),
      linear-gradient(70deg, transparent 55%, rgba(120,110,95,.2) 56%, transparent 58%),
      linear-gradient(20deg, transparent 25%, rgba(120,110,95,.18) 26%, transparent 28%);
    background-size:auto;
  }
  #app[data-table="persian-rug"] .felt::before{opacity:1;animation:rugDrift 14s linear infinite;}
  @keyframes rugDrift{
    0%{background-position:0 0, 0 0, 13px 13px;}
    100%{background-position:104px 0, -104px 0, 117px 13px;}
  }
  #app[data-table="persian-rug"] .rug-medallion{animation:rugSpin 90s linear infinite;}
  @keyframes rugSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  /* soft light falling from above, drifting very gently for a living-room feel */
  #app[data-table="persian-rug"] .felt{position:relative;}
  #app[data-table="persian-rug"] .table-wrap::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:50%/45%;
    background:radial-gradient(ellipse 60% 40% at var(--lx,50%) 8%, rgba(255,244,214,.16), transparent 60%);
    animation:lightDrift 9s ease-in-out infinite;
  }
  @keyframes lightDrift{0%,100%{--lx:46%;}50%{--lx:54%;}}
  /* mythic atmosphere: drifting gold dust over the felt, only when the mythic skin is active */
  #app[data-skin="mythic"] .table-wrap::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:50%/45%;
    background-image:
      radial-gradient(circle, rgba(233,201,119,.9) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(233,201,119,.7) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(233,201,119,.6) 1px, transparent 1.4px);
    background-size:180px 180px, 240px 240px, 210px 210px;
    background-position:20px 30px, 120px 160px, 60px 220px;
    animation:dustDrift 22s linear infinite;
    opacity:.55;
  }
  @keyframes dustDrift{0%{background-position:20px 30px, 120px 160px, 60px 220px;}100%{background-position:20px 330px, -120px 160px, 360px -80px;}}
  #app[data-table="luxury"] .felt::before{
    background-image:repeating-conic-gradient(from 0deg, rgba(242,212,136,.06) 0deg 8deg, transparent 8deg 16deg);
    background-size:auto;
  }
  html,body{margin:0;padding:0;height:100%;}
  html{ overscroll-behavior-y:none; }
  body{
    font-family:'Vazirmatn',sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, #2c1712 0%, #170d0a 55%, #0c0605 100%);
    color:var(--cream);
    min-height:100vh;
    min-height:100dvh; /* iOS/Android address-bar-safe viewport height */
    overflow-x:hidden;
    overscroll-behavior-y:none; /* stop pull-to-refresh from fighting card drags */
    -webkit-tap-highlight-color:transparent;
    transition:background .5s ease;
  }
  body[data-bg="dragon"]{background:radial-gradient(ellipse at 50% 0%, #123524 0%, #0a1f16 55%, #05100b 100%);}
  body[data-bg="lion"]{background:radial-gradient(ellipse at 50% 0%, #3a2a12 0%, #211505 55%, #120b03 100%);}
  body[data-bg="galaxy"]{
    background:
      radial-gradient(circle at 18% 26%, rgba(255,255,255,.7) 1px, transparent 1.6px),
      radial-gradient(circle at 62% 12%, rgba(255,255,255,.5) 1px, transparent 1.6px),
      radial-gradient(circle at 82% 46%, rgba(255,255,255,.6) 1px, transparent 1.6px),
      radial-gradient(circle at 34% 70%, rgba(255,255,255,.5) 1px, transparent 1.6px),
      radial-gradient(ellipse at 50% 0%, #1b1240 0%, #0d0930 55%, #05041a 100%);
    background-size:120px 120px, 160px 160px, 140px 140px, 150px 150px, auto;
  }
  body[data-bg="shahanshahi"]{background:radial-gradient(ellipse at 50% 0%, #2a1442 0%, #180a28 55%, #0d0616 100%);}
  body[data-bg="simurgh"]{background:radial-gradient(ellipse at 50% 0%, #123a2c 0%, #0a2018 55%, #05110c 100%);}

  .avatar{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;background:rgba(0,0,0,.3);border:2px solid var(--gold);flex-shrink:0;
  }
  .avatar.frame-dragon{border-color:#2f8f5c;box-shadow:0 0 8px rgba(47,143,92,.65);}
  .avatar.frame-lion{border-color:#c98a2e;box-shadow:0 0 8px rgba(201,138,46,.65);}
  .avatar.frame-shahanshahi{border-color:#b072e0;box-shadow:0 0 8px rgba(176,114,224,.65);}
  .avatar.frame-galaxy{border-color:#6f7bf0;box-shadow:0 0 10px rgba(111,123,240,.75);}
  .avatar.frame-simurgh{border-color:#e3bf6b;animation:simurghHalo 2.6s ease-in-out infinite;}
  @keyframes simurghHalo{
    0%,100%{box-shadow:0 0 8px rgba(227,191,107,.55),0 0 0 2px rgba(227,191,107,.25);}
    50%{box-shadow:0 0 18px rgba(227,191,107,.9),0 0 0 3px rgba(227,191,107,.4);}
  }
  #app{
    position:relative;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  }

  /* header */
  .topbar{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand b{font-size:20px;letter-spacing:1px;color:var(--gold-bright);font-weight:800;}
  .brand span{font-size:10px;color:#9db8ab;margin-top:3px;}
  .score-pill{display:flex;gap:6px;background:var(--panel);border:1px solid #1f4536;border-radius:999px;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.4) inset;}
  .score-pill .a{color:var(--teamA);font-weight:700;}
  .score-pill .b{color:var(--teamB);font-weight:700;}
  .score-pill .sep{color:#5a7266;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid #2a4f3f;color:var(--gold-bright);font-size:16px;cursor:pointer;
  }
  @media (hover:hover) and (pointer:fine){ .icon-btn:hover{border-color:var(--gold);} }
  @media (max-width:640px){
    .icon-btn{width:40px;height:40px;font-size:18px;} /* keep tap target >=40px on touch */
  }

  /* settings panel */
  .settings-box{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid #2a4f3f;border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto;}
  .settings-box h2{margin:0 0 14px;color:var(--gold-bright);font-size:20px;text-align:center;}
  .settings-section{margin-bottom:16px;}
  .settings-section h3{margin:0 0 8px;font-size:13px;color:#9db8ab;font-weight:600;}
  .swatch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .swatch{
    border-radius:10px;border:2px solid transparent;padding:8px 4px 6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.2);
  }
  .swatch.active{border-color:var(--gold-bright);box-shadow:0 0 10px rgba(242,212,136,.4);}
  .swatch .chip{width:100%;height:34px;border-radius:6px;}
  .swatch .lbl{font-size:10.5px;color:#e6dcc4;text-align:center;line-height:1.3;}
  .settings-close{width:100%;margin-top:6px;}
  .profile-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .profile-row input{
    flex:1;background:rgba(0,0,0,.25);border:1px solid #2a4f3f;border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:inherit;font-size:16px;
  }
  .profile-row input:focus{outline:none;border-color:var(--gold);}
  .swatch-grid.small{grid-template-columns:repeat(6,1fr);}
  .swatch-grid.small .chip{height:26px;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .settings-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .settings-tab{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--panel);border:1px solid #2a4f3f;font-size:12px;cursor:pointer;color:#cfd9d2;}
  .settings-tab.active{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#2a1e0a;font-weight:700;border-color:transparent;}

  /* table */
  .table-wrap{position:relative;width:100%;max-width:920px;aspect-ratio:16/10.5;margin-top:6px;}
  .felt{
    position:absolute;inset:0;
    border-radius:50%/45%;
    background:
      radial-gradient(ellipse at 50% 38%, var(--felt-1) 0%, var(--felt-2) 60%, var(--felt-edge) 100%);
    border:10px solid var(--table-border);
    outline:2px solid var(--table-outline);
    outline-offset:-8px;
    transition:background .4s ease, border-color .4s ease;
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 100px rgba(0,0,0,.55);
  }
  .felt::before{
    content:'';position:absolute;inset:16px;border-radius:inherit;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 26px, rgba(205,164,73,.35) 26px 28px, transparent 28px 52px),
      repeating-linear-gradient(-45deg, transparent 0 26px, rgba(205,164,73,.35) 26px 28px, transparent 28px 52px),
      radial-gradient(circle, rgba(232,215,176,.5) 1.4px, transparent 1.6px);
    background-size:auto, auto, 52px 52px;
    background-position:0 0, 0 0, 13px 13px;
  }
  .felt::after{
    content:'';position:absolute;inset:16px;border-radius:inherit;
    border:1.5px solid rgba(232,215,176,.4);
    box-shadow:inset 0 0 0 6px rgba(58,16,13,.0), inset 0 0 0 9px rgba(205,164,73,.25);
  }
  .rug-medallion{
    position:absolute;top:50%;left:50%;width:36%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(205,164,73,.32) 0deg 4deg, transparent 4deg 30deg),
      radial-gradient(circle, rgba(232,215,176,.18), transparent 72%);
    opacity:.55;pointer-events:none;z-index:1;
  }

  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;}
  .seat.north{top:2%;left:50%;transform:translateX(-50%);}
  .seat.south{bottom:1%;left:50%;transform:translateX(-50%);}
  .seat.west{left:1%;top:50%;transform:translateY(-50%);}
  .seat.east{right:1%;top:50%;transform:translateY(-50%);}

  .name-tag{
    font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;
    background:rgba(10,20,16,.75);border:1px solid #2a4f3f;color:#e6dcc4;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .name-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--teamA);}
  .seat.west .name-tag .dot, .seat.east .name-tag .dot{background:var(--teamB);}
  .name-tag.active{box-shadow:0 0 0 2px var(--gold-bright), 0 0 14px var(--gold-bright);color:#fff;}

  @keyframes wingSproutR{0%{opacity:0;transform:translateY(-50%) translateX(-6px) scale(.3) rotate(-10deg);}40%{opacity:.9;}100%{opacity:0;transform:translateY(-50%) translateX(10px) scale(1.15) rotate(14deg);}}

<script>
/* ---------- data ---------- */
const SUITS = {

  H:{symbol:'♥', get name(){ return t('suit_hearts','دل'); }, color:'red'},

};
const SUIT_ORDER = ['S','H','D','C'];
const RANK_LABEL = {11:'J',12:'Q',13:'K',14:'A'};
function rankLabel(r){ return RANK_LABEL[r] || String(r); }

/* ---------- state ---------- */
let state = {
  screen:'login',           // login | lobby | matchmaking | room-wait | game
  phase:null,                // choosing-trump | playing | hand-end | match-end
  mySeat:null, hakem:null, trump:null, turn:null,
  hand:[], handCounts:{}, seatNames:{},
  currentTrick:[], trickWinnerSeat:null,
  tricksWon:{A:0,B:0}, roundsWon:{A:0,B:0},
  handWinnerTeam:null, matchWinnerTeam:null,
  partnerConnected:true,
  toast:null, selectedIndex:null, shakeIndex:null,

/* ---------- phase 4: real networking ---------- */
// Server address: same host the page was served from, port 8000 — or localhost
// when the file is opened directly (file://). Change SERVER_URL if your
// server.py runs somewhere else.
const SERVER_URL = (function(){
  if(location.protocol==='http:' || location.protocol==='https:'){
    const proto = location.protocol==='https:' ? 'wss' : 'ws';
    return `${proto}://${location.hostname}:8000/ws`;
  }
  return 'ws://localhost:8000/ws';
})();

// Real Google Sign-In: paste the OAuth Web Client ID from
// https://console.cloud.google.com (see the setup steps at the top of
// hokm_auth.py). Must be the SAME client ID the server was started
// with (export GOOGLE_CLIENT_ID=...) — Google checks that the token's
// audience matches. Left empty, loginGoogle() falls back to guest, same
// as before this was wired up.
const GOOGLE_CLIENT_ID = "";

let ws = null;
let sessionToken = null;
let intentionalClose = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let pingTimer = null;

function connect(firstMessage){
  // Close any previous socket, but tag it as an intentional close on the
  // socket ITSELF — not on the shared `intentionalClose` variable. The old
  // socket's close event fires asynchronously (after this function already
  // returns), so a shared flag gets overwritten by the time it runs and the
  // old, on-purpose close gets misread as a real drop — which snaps the UI
  // back to the login screen right after a successful login. Tagging the
  // socket instance avoids that race entirely.
  if(ws){ ws._intentional = true; try{ ws.close(); }catch(e){} }
  const socket = new WebSocket(SERVER_URL);
  ws = socket;
  socket._intentional = false;
  // IMPORTANT: wire our own handlers — especially onopen, which sends the
  // login/reconnect message — BEFORE calling any panel's .attach(socket).
  // The server treats the very first message on a new connection as the
  // auth message; several panels (e.g. worldcup-panel.js) add their own
  // "open" listener that fires a request the instant the socket opens.
  // Event listeners run in registration order, so if a panel's listener
  // was registered first, its message could reach the server before our
  // login message — the server then sees a non-login first message and
  // immediately closes the connection with "ابتدا باید وارد شوید"
  // (must-login-first), which looks exactly like login silently failing.
  socket.onopen = ()=>{
    reconnectAttempts = 0;
    clearTimeout(reconnectTimer);
    if(firstMessage) socket.send(JSON.stringify(firstMessage));
    startPing();
  };
  socket.onmessage = (ev)=>{
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    handleServerMessage(msg);
  };
  socket.onclose = ()=>{
    stopPing();
    if(!socket._intentional) handleDrop();
  };
  socket.onerror = ()=>{ try{ socket.close(); }catch(e){} };
  if (window.HokmEconomy) HokmEconomy.attach(socket);
  if (window.HokmSocial) HokmSocial.attach(socket);
  if (window.HokmTournament) HokmTournament.attach(socket);
  if (window.HokmMonetization) HokmMonetization.attach(socket);
  if (window.HokmStats) HokmStats.attach(socket);
  if (window.HokmWorldCup) HokmWorldCup.attach(socket);
  if (window.HokmAchievements) HokmAchievements.attach(socket);
  if (window.HokmVoice) HokmVoice.attach(socket);
}

function sendMsg(obj){
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify(obj));
  } else {
    showToast('اتصال به سرور برقرار نیست...');
  }
}

function handleDrop(){
  if(!sessionToken){
    state.loggingIn = false;
    state.screen = 'login';
    render();
    return;
  }
  state.reconnecting = true;
  render();
  if(reconnectAttempts >= 10){
    showToast('اتصال مجدد ناموفق بود. دوباره وارد شو.');
    sessionToken = null;
    state.screen = 'login';
    state.reconnecting = false;
    render();
    return;
  }
  reconnectAttempts++;
  const delay = Math.min(1000*reconnectAttempts, 5000);
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(()=>{
    connect({type:'reconnect', session_token: sessionToken});
  }, delay);
}

function startPing(){
  stopPing();
  pingTimer = setInterval(()=>{
    if(ws && ws.readyState===WebSocket.OPEN){
      ws.send(JSON.stringify({type:'ping', ts: Date.now()}));
    }
  }, 3000);
}
function stopPing(){ clearInterval(pingTimer); }

function handleServerMessage(msg){
  switch(msg.type){
    case 'login_ok':
      sessionToken = msg.session_token;
      state.reconnecting = false;
      state.loggingIn = false;
      if(msg.name) state.profile.name = msg.name;
      if(msg.rank) state.rank = msg.rank;
      break;
    case 'season_reset':
      state.rank = msg.after;
      showToast(`فصل جدید شروع شد — رتبه‌ت به ${msg.after.label} برگشت`);
      break;
    case 'rank_update':
      state.rank = msg.after;
      state.rankChange = msg;
      break;
    case 'screen':
      clearInterval(state.mmTimer);
      state.screen = msg.name;
      if(msg.name === 'lobby') state.rankChange = null;
      break;
    case 'room_wait':
      state.screen = 'room-wait';
      state.roomCode = msg.code;
      state.roomSeats = msg.seats || {};
      state.roomMySeat = msg.mySeat || null;
      state.roomIsHost = !!msg.isHost;
      break;
    case 'game_state':
      applyGameState(msg);
      break;
    case 'toast':
      showToast(msg.message);
      break;
    case 'error':
      showToast(msg.message);
      if(msg.message && msg.message.indexOf('نشست پیدا نشد') !== -1){
        sessionToken = null;
        clearTimeout(reconnectTimer);
        state.screen = 'login';
        state.reconnecting = false;
      }
      break;
    case 'pong':
      state.ping = Math.max(1, Date.now() - msg.ts) + 'ms';
      break;
    case 'i18n_state':
      state.i18n.lang = msg.language || 'fa';
      state.i18n.languages = msg.languages || [];
      state.i18n.strings = msg.strings || {};
      document.documentElement.lang = state.i18n.lang;
      document.documentElement.dir = (state.i18n.lang === 'en' || state.i18n.lang === 'tr' || state.i18n.lang === 'ru') ? 'ltr' : 'rtl';
      break;
  }
  render();
}

function applyGameState(msg){
  const hadWinner = !!state.trickWinnerSeat;
  const wasHandEnd = state.phase==='hand-end';
  clearInterval(state.mmTimer);
  state.screen = 'game';
  state.reconnecting = false;
  state.mySeat = msg.mySeat;
  state.phase = msg.phase;
  state.hakem = msg.hakem;
  state.trump = msg.trump;
  state.turn = msg.turn;
  state.hand = msg.hand || [];
  state.handCounts = msg.handCounts || {};
  state.currentTrick = msg.currentTrick || [];
  state.trickWinnerSeat = msg.trickWinnerSeat || null;
  state.tricksWon = msg.tricksWon || {A:0,B:0};
  state.roundsWon = msg.roundsWon || {A:0,B:0};
  state.handWinnerTeam = msg.handWinnerTeam || null;
  state.matchWinnerTeam = msg.matchWinnerTeam || null;
  state.seatNames = msg.seatNames || {};
  state.partnerConnected = msg.partnerConnected !== false;
  state.selectedIndex = null;
  if(!hadWinner && state.trickWinnerSeat){
    setTimeout(spawnParticles, 0);
    setTimeout(triggerFeltSweep, 0);
  }
  // "سور" (kot): the hand just ended and the losing team took zero tricks
  if(!wasHandEnd && state.phase==='hand-end'){
    const {A,B} = state.tricksWon || {A:0,B:0};
    if((A===0 || B===0) && (A+B)>0){
      setTimeout(vfxKotExplosion, 250);
    }
  }
}

// Real Google Sign-In. google.accounts.id fires onGoogleCredential(response)
// with a signed ID token once the person picks their Google account —
// the server (hokm_auth.py) verifies that token against Google's own
// keys before trusting it, so no password or secret ever passes through
// this page. Requires GOOGLE_CLIENT_ID above to be set; otherwise this
// whole path is skipped and the button below just logs in as a guest,
// same behavior as before.
let gsiInitialized = false;
function initGoogleSignIn(){
  if(!GOOGLE_CLIENT_ID || gsiInitialized) return;
  if(!window.google || !window.google.accounts || !window.google.accounts.id) return; // script still loading
  window.google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    ux_mode: 'popup',
  });
  gsiInitialized = true;
}
function onGoogleCredential(response){
  if(!response || !response.credential){
    showToast('ورود با گوگل انجام نشد، دوباره تلاش کن');
    return;
  }
  state.loggingIn = true; render();
  connect({type:'login_google', id_token: response.credential});
}
// Renders Google's own (real, clickable) button invisibly on top of our
// styled "ورود با گوگل" button. Google requires its widget to be the
// thing that's actually clicked — this keeps our RTL styling while still
// using Google's real, safe sign-in UI underneath. Must be re-run after
// every renderLogin() since that rebuilds the DOM node from scratch.
function renderGoogleButton(){
  if(!GOOGLE_CLIENT_ID) return;
  initGoogleSignIn();
  const el = document.getElementById('gsiRealBtn');
  if(!el || !window.google || !window.google.accounts || !window.google.accounts.id) return;
  el.innerHTML = '';
  window.google.accounts.id.renderButton(el, {type:'standard', width:280, size:'large'});
}

function spawnParticles(){

  if(!layer) return;
  const n = 16;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2*i)/n + Math.random()*0.3;
    const dist = 40 + Math.random()*50;

  }

/* ==========================================================
   VFX ENGINE — one lightweight canvas particle system shared by:
     1) card-play dust trail (flyCardToCenter)
     2) trick-win light sweep + sparkle burst
     3) "kot/سور" full-sweep celebration explosion (confetti)
   Stays idle (no rAF loop, no draws) whenever there are zero
   live particles, so it costs nothing during normal play.
   ========================================================== */
const VFX = { particles: [], canvas:null, ctx:null, raf:null, w:0, h:0 };

/* ==========================================================
   SFX ENGINE — tiny synthesized sound set (Web Audio API, no
   audio files to fetch/host). Everything is generated from
   oscillators + a filtered noise burst, tuned to loosely evoke
   santur/tar plucks and a frame-drum thud so it fits the mythic
   atmosphere instead of sounding like generic UI beeps.
   ========================================================== */
const SFX = { ctx:null, muted:(function(){ try{ return localStorage.getItem('hokm_muted')==='1'; }catch(e){ return false; } })() };
function sfxCtx(){
  if(SFX.muted) return null;
  if(!SFX.ctx){
    try{ SFX.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(SFX.ctx.state==='suspended') SFX.ctx.resume();
  return SFX.ctx;
}
function sfxTone(freq, opts){
  const o = Object.assign({type:'sine', dur:.25, gain:.16, delay:0, attack:.006, decay:.2}, opts||{});
  const ctx = sfxCtx(); if(!ctx) return;
  const t0 = ctx.currentTime + o.delay;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = o.type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(o.gain, t0+o.attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+o.attack+o.decay+o.dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+o.attack+o.decay+o.dur+0.05);
}
function sfxNoiseBurst(opts){
  const o = Object.assign({dur:.12, gain:.12, delay:0, filterFreq:2200}, opts||{});
  const ctx = sfxCtx(); if(!ctx) return;
  const t0 = ctx.currentTime + o.delay;
  const n = Math.max(1, Math.floor(ctx.sampleRate*o.dur));
  const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const filt = ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=o.filterFreq;
  const g = ctx.createGain(); g.gain.setValueAtTime(o.gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
  src.connect(filt); filt.connect(g); g.connect(ctx.destination);
  src.start(t0);
}
// soft pluck + air whoosh — plays the instant a card leaves the hand
function sfxCardPlay(){ sfxNoiseBurst({dur:.08,gain:.09,filterFreq:3400}); sfxTone(560,{type:'triangle',dur:.05,gain:.045,decay:.05}); }
// quiet tap for selecting/deselecting a card in hand
function sfxCardTap(){ sfxTone(720,{type:'sine',dur:.03,gain:.03,decay:.03}); }
// rising three-note chime when a trick is won, synced to the felt sweep
function sfxTrickWin(){ [660,880,990].forEach((f,i)=>sfxTone(f,{type:'sine',dur:.28,gain:.08,delay:i*0.07,decay:.18})); }
// shimmering high bell for the trump-card magic burst
function sfxTrumpMagic(){ [990,1320,1760].forEach((f,i)=>sfxTone(f,{type:'sine',dur:.3,gain:.055,delay:i*0.05,decay:.22})); sfxNoiseBurst({dur:.15,gain:.045,filterFreq:6500}); }
// deep gong + cascading chimes for a full sweep ("سور"/kot)
function sfxKot(){
  sfxTone(110,{type:'sine',dur:.9,gain:.15,decay:.6});
  sfxTone(165,{type:'sine',dur:.7,gain:.08,decay:.5,delay:.02});
  [220,330,440,550].forEach((f,i)=>sfxTone(f,{type:'triangle',dur:.4,gain:.055,delay:.15+i*0.09,decay:.25}));
}

function vfxAccentColor(){
  // reads the current skin's glow color so every effect matches the
  // equipped theme instead of always being gold
  const app = document.getElementById('app');
  const v = app && getComputedStyle(app).getPropertyValue('--skin-glow').trim();
  return v || 'rgba(242,212,136,.6)';
}
function vfxEnsureCanvas(){
  const c = document.querySelector('.vfx-canvas');
  if(!c) return null;
  if(VFX.canvas !== c){
    VFX.canvas = c;
    VFX.ctx = c.getContext('2d');
  }
  const wrap = document.querySelector('.table-wrap');
  if(wrap){
    const r = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    if(c.width !== Math.round(r.width*dpr) || c.height !== Math.round(r.height*dpr)){
      c.width = Math.round(r.width*dpr);
      c.height = Math.round(r.height*dpr);
      VFX.ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    VFX.w = r.width; VFX.h = r.height;
  }
  return c;
}
function vfxSpawn(list){ VFX.particles.push(...list); vfxLoop(); }
function vfxLoop(){
  if(VFX.raf) return; // already running
  const step = ()=>{
    const c = vfxEnsureCanvas();
    if(!c || !VFX.ctx){ VFX.raf=null; return; }
    const ctx = VFX.ctx;
    ctx.clearRect(0,0,VFX.w,VFX.h);
    const now = performance.now();
    VFX.particles = VFX.particles.filter(p=>now < p.until);
    for(const p of VFX.particles){
      const t = 1 - Math.max(0,(p.until-now))/p.life;   // 0..1 progress
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity||0;
      p.vx *= (p.drag!=null?p.drag:0.985);
      p.vy *= (p.drag!=null?p.drag:0.985);
      p.rot = (p.rot||0) + (p.spin||0);
      const alpha = Math.max(0, 1 - t);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      if(p.rot) ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if(p.shape==='rect'){
        ctx.fillRect(-p.size/2, -p.size*0.35, p.size, p.size*0.7);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size*(1-t*0.4),0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if(VFX.particles.length){
      VFX.raf = requestAnimationFrame(step);
    } else {
      ctx.clearRect(0,0,VFX.w,VFX.h);
      VFX.raf = null;
    }
  };
  VFX.raf = requestAnimationFrame(step);
}

/* small trailing dust, used behind a flying card */
function vfxTrail(xRatio, yRatio, color){
  vfxEnsureCanvas();
  const x = xRatio*VFX.w, y = yRatio*VFX.h;
  const list = [];
  for(let i=0;i<3;i++){
    list.push({
      x:x+(Math.random()-0.5)*6, y:y+(Math.random()-0.5)*6,
      vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.6,
      gravity:0.01, drag:0.94, size:2+Math.random()*2.4,
      color: color||vfxAccentColor(), life:520, until:performance.now()+520,
    });
  }
  vfxSpawn(list);
}

/* sparkle burst at a point (0..1 ratios of table-wrap) — used for the
   winning trick card, in addition to the felt light-sweep ring */
function vfxSparkleBurst(xRatio, yRatio, color){
  vfxEnsureCanvas();
  const x = xRatio*VFX.w, y = yRatio*VFX.h;
  const n = 20, list = [];
  for(let i=0;i<n;i++){
    const angle = (Math.PI*2*i)/n + Math.random()*0.4;
    const speed = 1.4 + Math.random()*2.2;
    list.push({
      x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      gravity:0.03, drag:0.965, size:2+Math.random()*2.6,
      color: color||vfxAccentColor(), life:650+Math.random()*200, until:performance.now()+650+Math.random()*200,
    });
  }
  vfxSpawn(list);
}

/* radial light wave across the felt when a trick is won */
function triggerFeltSweep(){
  const ring = document.querySelector('.felt-sweep');
  if(!ring) return;
  ring.classList.remove('go');
  void ring.offsetWidth; // restart animation
  ring.classList.add('go');
  vfxSparkleBurst(0.5, 0.5);
  sfxTrickWin();
}

/* big multi-colored confetti explosion for a full sweep ("kot"/"سور") —
   winning every trick in the hand with the opponents left at zero */
function vfxKotExplosion(){
  vfxEnsureCanvas();
  const colors = ['#f2d488','#cda449','#e05a5a','#5ac8e0','#8fe0a8','#e08fd0'];
  const cx = VFX.w/2, cy = VFX.h*0.42;
  const n = 90, list = [];
  for(let i=0;i<n;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 2 + Math.random()*5.5;
    list.push({
      x:cx, y:cy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 1.5,
      gravity:0.09, drag:0.988,
      size:3+Math.random()*4, shape: Math.random()<0.5?'rect':'circle',
      rot:Math.random()*Math.PI, spin:(Math.random()-0.5)*0.35,
      color: colors[i%colors.length],
      life:1300+Math.random()*500, until:performance.now()+1300+Math.random()*500,
    });
  }
  vfxSpawn(list);
  sfxKot();

}

/* flying "ghost" card: clones the tapped card and animates it from the
   hand to the middle of the table, trailing dust the whole way — this
   plays instantly on tap, independent of the server round-trip */
function flyCardToCenter(sourceEl, card){
  const wrap = document.querySelector('.table-wrap');
  if(!sourceEl || !wrap) return;
  const startRect = sourceEl.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const ghost = sourceEl.cloneNode(true);
  ghost.classList.add('fly-card');
  ghost.style.width = startRect.width+'px';
  ghost.style.height = startRect.height+'px';
  ghost.style.transform = `translate(${startRect.left}px, ${startRect.top}px) rotate(0deg)`;
  ghost.style.opacity = '1';
  document.body.appendChild(ghost);
  sfxCardPlay();

  const endX = wrapRect.left + wrapRect.width*0.5 - startRect.width/2;
  const endY = wrapRect.top + wrapRect.height*0.55 - startRect.height/2;
  requestAnimationFrame(()=>{
    ghost.style.transform = `translate(${endX}px, ${endY}px) rotate(${(Math.random()*40-20).toFixed(0)}deg) scale(.92)`;
  });

  // trailing dust sampled along the flight path
  const steps = 10;
  const color = vfxAccentColor();
  for(let i=1;i<=steps;i++){
    setTimeout(()=>{
      const t = i/steps;
      const px = startRect.left + (endX-startRect.left)*t + startRect.width/2;
      const py = startRect.top + (endY-startRect.top)*t + startRect.height/2;
      vfxTrail((px-wrapRect.left)/wrapRect.width, (py-wrapRect.top)/wrapRect.height, color);
    }, i*40);
  }
  setTimeout(()=>{
    ghost.style.opacity = '0';
    setTimeout(()=>ghost.remove(), 200);
  }, 380);

  // magical burst when a trump card lands — the doc's "اثر جادویی"
  if(card && state.trump && card.suit===state.trump){
    setTimeout(()=>{
      const cx = (endX + startRect.width/2 - wrapRect.left)/wrapRect.width;
      const cy = (endY + startRect.height/2 - wrapRect.top)/wrapRect.height;
      vfxSparkleBurst(cx, cy, color);
      sfxTrumpMagic();
    }, 380);
  }
}

/* ---------- seat helpers: rotate the table so mySeat always sits "south" (bottom) ---------- */
function cssPosOf(seat){
  const my = state.mySeat || 'south';
  const partner = my==='north' ? 'south' : 'north';
  if(seat===my) return 'south';
  if(seat===partner) return 'north';
  return seat; // west/east are always the bot seats
}

/* ---------- render ---------- */
function cardHTML(card, extraClass, dataAttr){
  const info = SUITS[card.suit];
  const isTrump = state.trump && card.suit===state.trump;
  const cls = (info.color==='red' ? 'pcard red' : 'pcard') + (isTrump ? ' trump-suit' : '');
  return `<div class="${cls} ${extraClass||''}" ${dataAttr||''}>
    <div class="r">${rankLabel(card.rank)}</div>
    <div class="s" data-suit="${card.suit}">${info.symbol}</div>
    <div class="r" style="align-self:flex-end;transform:rotate(180deg);">${rankLabel(card.rank)}</div>
  </div>`;
}
function backFanHTML(count){
  let html='';
  for(let i=0;i<count;i++) html += `<div class="card-back" style="--bd:${(i*0.16).toFixed(2)}s"></div>`;
  return html;
}
function medallionHTML(){
  if(!state.trump) return `<div class="medallion empty">؟</div>`;
  const info = SUITS[state.trump];
  const cls = info.color==='red'?'suit-red':'suit-black';
  return `<div class="medallion"><span class="${cls}">${info.symbol}</span></div>`;
}
function nameTagHTML(seat){
  if(!seat) return '';
  const active = state.turn===seat && state.phase==='playing';
  const isHakem = state.hakem===seat;
  const isMe = seat===state.mySeat;
  const isPartner = !isMe && seat!=='west' && seat!=='east';
  const offline = isPartner && !state.partnerConnected;
  const displayName = isMe && state.profile.name.trim() ? state.profile.name.trim() : (state.seatNames[seat] || seat);
  const avatarHTML = isMe ? `<span class="avatar frame-${state.profile.frame}">${state.profile.avatar}</span>` : '';
  return `<div class="name-tag ${active?'active':''}">
    ${avatarHTML}<span class="dot"></span>${displayName}${isHakem?` <span class="hakem-mark">(حاکم)</span>`:''}${offline?` <span class="hakem-mark" style="color:#e0524a;">(قطع)</span>`:''}
  </div>`;
}
function seatsHTML(){
  const bySeat = {};
  ['south','west','north','east'].forEach(abs=>{ bySeat[cssPosOf(abs)] = abs; });
  return `
    <div class="seat north">${nameTagHTML(bySeat['north'])}<div class="back-fan">${backFanHTML(state.handCounts[bySeat['north']]||0)}</div></div>
    <div class="seat west">${nameTagHTML(bySeat['west'])}<div class="back-fan">${backFanHTML(state.handCounts[bySeat['west']]||0)}</div></div>
    <div class="seat east">${nameTagHTML(bySeat['east'])}<div class="back-fan">${backFanHTML(state.handCounts[bySeat['east']]||0)}</div></div>
    <div class="seat south">${nameTagHTML(bySeat['south'])}</div>
  `;

function trickCardsHTML(){
  let html='';
  for(const play of state.currentTrick){
    const winning = state.trickWinnerSeat===play.seat;
    html += `<div class="trick-card p-${cssPosOf(play.seat)} ${winning?'winner':''}">${cardHTML(play.card)}</div>`;
  }
  return html;
}
function handHTML(){
  const hand = state.hand || [];
  const n = hand.length;
  const spread = Math.min(34, 320/Math.max(n,1));
  return hand.map((c,i)=>{
    const offset = (i - (n-1)/2) * spread;
    const rot = (i - (n-1)/2) * 3;
    const led = state.currentTrick.length ? state.currentTrick[0].card.suit : null;
    const mustFollow = led && hand.some(cc=>cc.suit===led) && c.suit!==led;
    const notYourTurn = !(state.phase==='playing' && state.turn===state.mySeat);
    const disabled = mustFollow || notYourTurn;
    const selected = state.selectedIndex===i ? 'selected' : '';
    const shaking = state.shakeIndex===i ? 'shake' : '';
    const extra = `${disabled?'disabled':''} ${selected} ${shaking}`.trim();
    return cardHTML(c, extra, `style="--tx:${offset}px;--rot:${rot}deg;--bd:${(i*0.14).toFixed(2)}s;z-index:${i}" data-card-index="${i}"`);
  }).join('');
}

  } else if(state.phase==='hand-end'){
    const winnerTeam = state.handWinnerTeam;
    overlay = `<div class="overlay"><div class="card-box">
      <h2>${winnerTeam==='A'?t('hand_won_title','دست به تیم شما رسید! 🎉'):t('hand_lost_title','این دست رو حریف برد')}</h2>
      <p>${t('hand_result_line','نتیجه‌ی این دست: {a} - {b} (تیک)').replace('{a}',state.tricksWon.A).replace('{b}',state.tricksWon.B)}<br>
      ${t('match_score_line','امتیاز مسابقه: تیم شما {a} — حریف {b}').replace('{a}',state.roundsWon.A).replace('{b}',state.roundsWon.B)}</p>
      <button class="btn" data-action="next-hand">${t('next_hand_btn','دست بعدی')}</button>
    </div></div>`;
  } else if(state.phase==='match-end'){
    const winnerTeam = state.matchWinnerTeam;
    overlay = `<div class="overlay"><div class="card-box">
      <h2>${winnerTeam==='A'?t('match_won_title','برنده شدید! 🏆'):t('match_lost_title','مسابقه رو باختید')}</h2>
      <p>${t('final_result_line','نتیجه‌ی نهایی: تیم شما {a} دست — حریف {b} دست').replace('{a}',state.roundsWon.A).replace('{b}',state.roundsWon.B)}</p>
      ${rankChangeHTML()}
      <button class="btn" data-action="new-match">${t('new_match_btn','مسابقه‌ی جدید')}</button>
    </div></div>`;
  }

  app.innerHTML = `
    ${state.reconnecting?`<div class="reconnect-banner">${t('reconnect_banner','📡 اتصال قطع شد — در حال تلاش برای اتصال مجدد...')}</div>`:''}
    <div class="topbar">
      <div class="brand"><b>حکم</b><span>${t('topbar_subtitle','فاز ۴ — آنلاین (سرور واقعی)')}</span></div>
      <div class="topbar-actions">
        <div class="ping-badge ${typeof state.ping==='number'&&state.ping>150?'bad':''}"><span class="dot2"></span>${state.ping}</div>
        <div class="score-pill"><span class="a">${t('your_team','تیم شما')} ${state.roundsWon.A}</span><span class="sep">–</span><span class="b">${state.roundsWon.B} ${t('opponent','حریف')}</span></div>
        <div class="icon-btn" data-action="toggle-mute" title="${t('mute_tooltip','صدا')}">${SFX.muted?'🔇':'🔊'}</div>
        <div class="icon-btn" data-action="open-settings" title="${t('tab_theme','پوسته و میز')}">⚙</div>
      </div>
    </div>
    <div class="table-wrap">
      <div class="felt"></div>
      <div class="rug-medallion"></div>
      ${medallionHTML()}
      ${seatsHTML()}
      <div class="trick-area">${trickCardsHTML()}</div>
      <div class="particle-layer"></div>
      <div class="felt-sweep"></div>
      <canvas class="vfx-canvas"></canvas>
    </div>
    <div class="hand">${handHTML()}</div>
    <div class="footnote">${t('footnote_tricks','تیک‌های این دست — تیم شما: {a} \u00a0|\u00a0 حریف: {b}').replace('{a}',state.tricksWon.A).replace('{b}',state.tricksWon.B)}<br>${t('footnote_note','فاز ۴: ورود مهمان، اتاق خصوصی و بازی سریع روی سرور واقعی با WebSocket، پینگ واقعی و reconnect خودکار. سیستم رتبه‌بندی واقعی و اقتصاد بازی در فازهای بعدی.')}</div>
    ${overlay}
    ${state.toast?`<div class="toast">${state.toast}</div>`:''}
  `;
}

/* ---------- events (delegated) ---------- */
document.getElementById('app').addEventListener('click', (e)=>{
  const loginGoogleBtn = e.target.closest('[data-action="login-google"]');
  if(loginGoogleBtn){ loginGoogle(); return; }
  const loginGuestBtn = e.target.closest('[data-action="login-guest"]');
  if(loginGuestBtn){ loginGuest(); return; }
  const quickMatchBtn = e.target.closest('[data-action="quick-match"]');
  if(quickMatchBtn){ quickMatch(); return; }
  const createRoomBtn = e.target.closest('[data-action="create-room"]');
  if(createRoomBtn){ createRoom(); return; }
  const joinRoomBtn = e.target.closest('[data-action="join-room"]');
  if(joinRoomBtn){ const inp=document.getElementById('join-code-input'); joinRoom(inp?inp.value:''); return; }
  const cancelMmBtn = e.target.closest('[data-action="cancel-matchmaking"]');
  if(cancelMmBtn){ cancelMatchmaking(); return; }
  const leaveRoomBtn = e.target.closest('[data-action="leave-room"]');
  if(leaveRoomBtn){ leaveRoom(); return; }
  const startWithBotsBtn = e.target.closest('[data-action="start-with-bots"]');
  if(startWithBotsBtn){ sendMsg({type:'start_with_bots'}); return; }
  const disconnectBtn = e.target.closest('[data-action="simulate-disconnect"]');
  if(disconnectBtn){ simulateDisconnect(); return; }
  const openSettings = e.target.closest('[data-action="open-settings"]');
  if(openSettings){ state.showSettings=true; render(); return; }
  const toggleMute = e.target.closest('[data-action="toggle-mute"]');
  if(toggleMute){ SFX.muted = !SFX.muted; try{ localStorage.setItem('hokm_muted', SFX.muted?'1':'0'); }catch(e){} render(); return; }
  const closeSettings = e.target.closest('[data-action="close-settings"]');
  if(closeSettings){ state.showSettings=false; render(); return; }
  const skinSwatch = e.target.closest('[data-set-skin]');
  if(skinSwatch){ state.skin = skinSwatch.dataset.setSkin; state.previewSkin = null; showToast(t('skin_equipped','پوسته اعمال شد ✓')); render(); return; }
  const tableSwatch = e.target.closest('[data-set-table]');
  if(tableSwatch){ state.table = tableSwatch.dataset.setTable; state.previewTable = null; showToast(t('table_equipped','میز اعمال شد ✓')); render(); return; }
  const tabBtn = e.target.closest('[data-set-tab]');
  if(tabBtn){ state.settingsTab = tabBtn.dataset.setTab; render(); return; }
  const langSwatch = e.target.closest('[data-set-lang]');
  if(langSwatch){ sendMsg({type:'set_language', lang: langSwatch.dataset.setLang}); return; }
  const avatarSwatch = e.target.closest('[data-set-avatar]');
  if(avatarSwatch){ state.profile.avatar = avatarSwatch.dataset.setAvatar; render(); return; }
  const frameSwatch = e.target.closest('[data-set-frame]');
  if(frameSwatch){ state.profile.frame = frameSwatch.dataset.setFrame; render(); return; }
  const bgSwatch = e.target.closest('[data-set-bg]');
  if(bgSwatch){ state.profile.background = bgSwatch.dataset.setBg; render(); return; }
  const nextBtn = e.target.closest('[data-action="next-hand"]');
  if(nextBtn){ sendNextHand(); return; }
  const newMatchBtn = e.target.closest('[data-action="new-match"]');
  if(newMatchBtn){ sendNewMatch(); return; }
  const trumpBtn = e.target.closest('[data-choose-trump]');
  if(trumpBtn){ sendChooseTrump(trumpBtn.dataset.chooseTrump); return; }
  const feltEl = e.target.closest('.felt, .rug-medallion, .trick-area');
  if(feltEl && state.selectedIndex!=null){ state.selectedIndex=null; render(); }
});

/* ---------- live shop preview: hovering a swatch previews it for real,
   on the actual table/cards, without committing anything ---------- */
document.getElementById('app').addEventListener('mouseover', (e)=>{
  const skinSwatch = e.target.closest('[data-set-skin]');
  if(skinSwatch){
    if(state.previewSkin !== skinSwatch.dataset.setSkin){ state.previewSkin = skinSwatch.dataset.setSkin; render(); }
    return;
  }
  const tableSwatch = e.target.closest('[data-set-table]');
  if(tableSwatch && state.previewTable !== tableSwatch.dataset.setTable){
    state.previewTable = tableSwatch.dataset.setTable; render();
  }
});
document.getElementById('app').addEventListener('mouseout', (e)=>{
  const leavingSkin = e.target.closest('[data-set-skin]');
  if(leavingSkin && (!e.relatedTarget || !leavingSkin.contains(e.relatedTarget)) && state.previewSkin){
    state.previewSkin = null; render();
  }
  const leavingTable = e.target.closest('[data-set-table]');
  if(leavingTable && (!e.relatedTarget || !leavingTable.contains(e.relatedTarget)) && state.previewTable){
    state.previewTable = null; render();
  }
});

document.getElementById('app').addEventListener('input', (e)=>{
  if(e.target && e.target.id==='profile-name-input'){
    state.profile.name = e.target.value;
  }
});

/* select-on-first-tap, play-on-second-tap; dragging just previews and snaps back */
function handleCardTap(idx){
  if(!(state.phase==='playing' && state.turn===state.mySeat)) return;
  const hand = state.hand;
  const card = hand[idx];
  if(!card) return;
  const led = state.currentTrick.length ? state.currentTrick[0].card.suit : null;
  const mustFollow = led && hand.some(c=>c.suit===led) && card.suit!==led;
  if(mustFollow){
    showToast('باید همخال بازی کنید');
    state.shakeIndex = idx;
    render();
    setTimeout(()=>{ state.shakeIndex=null; render(); }, 400);
    return;
  }
  if(state.selectedIndex===idx){
    const cardEl = document.querySelector(`.hand [data-card-index="${idx}"]`);
    if(cardEl) flyCardToCenter(cardEl, card);
    sendPlayCard(card);
    state.selectedIndex = null;
    render();
  } else {
    state.selectedIndex = idx;
    sfxCardTap();
    render();
  }
}

/* ---------- 3D holographic tilt/sheen (pointer-tracked) ---------- */
document.addEventListener('pointermove', (e)=>{
  const cardEl = e.target.closest && e.target.closest('.hand .pcard:not(.disabled)');
  document.querySelectorAll('.hand .pcard.tilted').forEach(el=>{
    if(el!==cardEl){
      el.classList.remove('tilted');
      el.style.removeProperty('--tiltX'); el.style.removeProperty('--tiltY');
      el.style.removeProperty('--mx'); el.style.removeProperty('--my'); el.style.removeProperty('--shine');
    }
  });
  if(!cardEl || drag) return;
  const r = cardEl.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width;   // 0..1
  const py = (e.clientY - r.top) / r.height;   // 0..1
  cardEl.classList.add('tilted');
  cardEl.style.setProperty('--tiltX', `${(px-0.5)*18}deg`);
  cardEl.style.setProperty('--tiltY', `${(0.5-py)*14}deg`);
  cardEl.style.setProperty('--mx', `${px*100}%`);
  cardEl.style.setProperty('--my', `${py*100}%`);
  cardEl.style.setProperty('--shine', `${px*160-30}%`);
}, {passive:true});

let drag = null;
document.addEventListener('pointerdown', (e)=>{
  const cardEl = e.target.closest('.hand [data-card-index]');
  if(!cardEl || cardEl.classList.contains('disabled')) return;
  if(!(state.phase==='playing' && state.turn===state.mySeat)) return;
  drag = { idx: parseInt(cardEl.dataset.cardIndex,10), cardEl, startX:e.clientX, startY:e.clientY, moved:false };
  cardEl.classList.add('dragging');
  if(cardEl.setPointerCapture) { try{ cardEl.setPointerCapture(e.pointerId); }catch(err){} }
});
document.addEventListener('pointermove', (e)=>{
  if(!drag || !document.contains(drag.cardEl)) return;
  const dx = e.clientX-drag.startX, dy = e.clientY-drag.startY;
  if(Math.abs(dx)>6 || Math.abs(dy)>6) drag.moved = true;
  if(drag.moved){
    drag.cardEl.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(1.1)`;
  }
});
function endDrag(){
  if(!drag) return;
  const {idx, cardEl, moved} = drag;
  if(document.contains(cardEl)){
    cardEl.classList.remove('dragging');
    cardEl.style.transform = '';
  }
  drag = null;
  if(!moved) handleCardTap(idx);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

render();
</script>
